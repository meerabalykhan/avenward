services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile --store-dir /tmp/pnpm-store && pnpm dev",
      ]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    profiles: ["live"]

volumes:
  frontend_node_modules:
